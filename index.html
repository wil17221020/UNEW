<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RutaFlota</title>
<meta name="description" content="Prototipo de app de viajes para una flota de vehículos de alquiler en Santo Domingo.">
<meta name="theme-color" content="#0C7566">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RutaFlota">
<meta property="og:title" content="RutaFlota · prototipo">
<meta property="og:description" content="App de viajes para pasajeros y conductores de la flota, con panel para la oficina.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app de viajes a pantalla completa. El mapa ocupa todo; la hoja inferior (panel lateral en escritorio) lleva el flujo; menú lateral y páginas superpuestas. El panel de la flota es una vista aparte (#flota). */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F2F5F4; --ink:#12201E; --muted:#5A6A67; --line:#DCE3E1;
  --accent:#0C7566; --accent-soft:#D8EEE8; --accent-ink:#FFFFFF;
  --btn:#111A18; --btn-ink:#FFFFFF;
  --signal:#C97A12; --signal-soft:#FBEBD3;
  --danger:#C23D2B; --danger-soft:#F8DED9; --ok:#2B8A55; --ok-soft:#DCF0E3;
  --land:#E3E9E6; --street:#FFFFFF; --avenue:#F3D292; --sea:#B7D5E0; --river:#A3C6D3; --label:#41524F;
  --plate-band:#1D4FA0; --scrim:rgba(10,18,17,.45);
  --shadow:0 2px 6px rgba(18,32,30,.08),0 12px 32px rgba(18,32,30,.14);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1413; --surface:#142020; --surface-2:#1B2928; --ink:#E3ECEA; --muted:#93A6A2; --line:#2A3A38;
  --accent:#38BCA6; --accent-soft:#163430; --accent-ink:#04201B;
  --btn:#EAF1EF; --btn-ink:#0C1413;
  --signal:#F0A43E; --signal-soft:#3A2C17;
  --danger:#EF6450; --danger-soft:#3D1F1A; --ok:#4CC488; --ok-soft:#173326;
  --land:#16201F; --street:#243331; --avenue:#5C4A24; --sea:#0D2932; --river:#12313B; --label:#A9BBB7;
  --plate-band:#2F63B8; --scrim:rgba(0,0,0,.55); --shadow:0 2px 6px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1413; --surface:#142020; --surface-2:#1B2928; --ink:#E3ECEA; --muted:#93A6A2; --line:#2A3A38;
  --accent:#38BCA6; --accent-soft:#163430; --accent-ink:#04201B;
  --btn:#EAF1EF; --btn-ink:#0C1413;
  --signal:#F0A43E; --signal-soft:#3A2C17;
  --danger:#EF6450; --danger-soft:#3D1F1A; --ok:#4CC488; --ok-soft:#173326;
  --land:#16201F; --street:#243331; --avenue:#5C4A24; --sea:#0D2932; --river:#12313B; --label:#A9BBB7;
  --plate-band:#2F63B8; --scrim:rgba(0,0,0,.55); --shadow:0 2px 6px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.app-mode{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- App ---------- */
#map-cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--land)}
.fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:46px;height:46px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;z-index:6}
.earn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:9px 18px;font-family:var(--f-display);font-stretch:88%;font-weight:800;font-size:20px;box-shadow:var(--shadow);z-index:6;font-variant-numeric:tabular-nums;white-space:nowrap}
.earn small{font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.7;margin-left:6px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:min(72dvh,620px);overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(10,20,18,.18);z-index:5;
  padding-top:22px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
@media (min-width:900px){
  .sheet{left:calc(16px + env(safe-area-inset-left,0px));right:auto;top:76px;bottom:16px;width:410px;max-height:none;border-radius:18px;box-shadow:var(--shadow);padding-top:20px;padding-bottom:20px;padding-left:20px;padding-right:20px}
  .sheet::before{display:none}
  .sheet.fit{bottom:auto;max-height:calc(100% - 92px)}
}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-title{font-family:var(--f-display);font-stretch:90%;font-weight:750;font-size:24px;line-height:1.12;margin:2px 0 0;text-wrap:balance}
.muted{color:var(--muted);margin:0}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}

.btn{border:1px solid transparent;border-radius:12px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,filter .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.go{background:var(--accent);color:var(--accent-ink);font-size:17px;padding:16px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ghost:hover{filter:brightness(.97)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px;font-size:inherit}

.welcome{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.role{display:flex;align-items:center;gap:14px;border:0;background:var(--surface-2);border-radius:16px;padding:16px;text-align:left;width:100%}
.role:hover{filter:brightness(.97)}
.role b{display:block;font-size:17px;font-weight:700}
.role small{color:var(--muted);font-size:13px}
.role > span:nth-child(2){flex:1;min-width:0}
.role-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.role-ic.p{background:var(--accent-soft);color:var(--accent)}
.role-ic.d{background:var(--signal-soft);color:var(--signal)}
.chev{color:var(--muted);font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:600;padding:0;align-self:flex-start}
.acct{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px;text-align:left;width:100%}
.acct:last-child{border-bottom:0}
.acct b{display:block;font-weight:600}
.acct small{display:block;color:var(--muted);font-size:12.5px}
.acct > span:nth-child(2){flex:1;min-width:0}

.search-pill{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:4px 14px}
.search-pill input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:17px;font-weight:600}
.search-pill input::placeholder{color:var(--ink);opacity:.8}
.search-pill input:focus{outline:none}
.search-pill:focus-within{box-shadow:0 0 0 2px var(--accent)}
.pickup{display:flex;align-items:center;gap:10px;font-size:13.5px}
.pickup select{flex:1;min-width:0;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-weight:600}
.sugg{display:flex;flex-direction:column}
.sugg-item{display:flex;align-items:center;gap:14px;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 2px;text-align:left}
.sugg-item:last-child{border-bottom:0}
.sugg-item b{display:block;font-weight:600}
.sugg-item small{color:var(--muted);font-size:12.5px}
.s-ic{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px;margin:6px 0}
.trip-route{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 8px;background:var(--surface-2);border-radius:14px;padding:12px 14px}
.rt-rows{display:flex;flex-direction:column;gap:9px;min-width:0}
.rt-row{display:flex;gap:12px;align-items:center;min-width:0}
.rt-row small{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.rt-row b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:11px;height:11px;flex:none}
.dot.o{border-radius:50%;border:3px solid var(--accent);background:var(--surface)}
.dot.d{background:var(--ink);border-radius:2px}
.rt-meta{font-size:13px;color:var(--muted)}
.cats{display:flex;flex-direction:column;gap:6px}
.cat{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:10px;border:2px solid transparent;background:var(--surface);border-radius:14px;padding:8px 12px 8px 6px;text-align:left}
.cat.on{border-color:var(--ink);background:var(--surface-2)}
.cat b{font-weight:700;font-size:15.5px}
.cat small{display:block;font-size:12.5px;color:var(--muted)}
.cat-px{font-weight:700;font-variant-numeric:tabular-nums}
.cat-ic{display:flex;justify-content:center;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:500}
.chip.on{border-color:var(--ink);background:var(--surface-2);font-weight:650}
.scanbar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;position:relative}
.scanbar::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:var(--accent);border-radius:4px;animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.drv-card{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;font-weight:700;flex:none}
.av.p{background:var(--accent-soft);color:var(--accent)}
.dc-tx{flex:1;min-width:0}
.dc-tx b{display:block;font-weight:650}
.dc-tx small{display:block;color:var(--muted);font-size:12.5px}
.plate{font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.06em;background:#FFFFFF;color:#111111;border:1.5px solid #2A2A2A;border-radius:4px;padding:10px 7px 3px;position:relative;white-space:nowrap;line-height:1;flex:none}
.plate::before{content:"REP. DOMINICANA";position:absolute;inset:0 0 auto;height:7px;background:var(--plate-band);color:#FFFFFF;font-size:5px;letter-spacing:.12em;line-height:7px;text-align:center;border-radius:2px 2px 0 0}
.pin-box{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px}
.pin-box span{font-size:13px;font-weight:600}
.pin-box small{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.pin{font-family:var(--f-mono);font-size:26px;letter-spacing:.16em;grid-row:1/2;grid-column:2}
.row-actions{display:flex;gap:8px}
.row-actions .btn{flex:1}
.prog{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}
.big-fare{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.lines{margin:0;display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:10px}
.lines div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.lines dt{color:var(--muted)}
.lines dd{margin:0;font-variant-numeric:tabular-nums}
.pay-line{font-size:13.5px;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stars{display:flex;gap:4px}
.stars button{border:0;background:none;font-size:32px;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--signal)}

.offer-top{display:flex;justify-content:space-between;align-items:center}
.offer-sec{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 11px}
.offer-bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.offer-bar i{display:block;height:100%;background:var(--accent)}
.status-row{display:flex;align-items:center;gap:12px}
.status-row div{flex:1;min-width:0}
.status-row b{display:block;font-size:17px}
.status-row small{color:var(--muted);font-size:13px}
.off-dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0}
.stat small{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bal{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.bal.owe{background:var(--signal-soft)}
.bal.credit{background:var(--ok-soft)}
.bal b{font-size:18px;font-variant-numeric:tabular-nums}
.bal small{font-size:12.5px;color:var(--muted)}
.done-banner{background:var(--ok-soft);border-radius:14px;padding:11px 14px;font-size:13.5px}
.done-banner b{font-size:15px}
.pin-entry{display:flex;gap:8px}
.pin-entry input{flex:1;min-width:0;font-family:var(--f-mono);font-size:24px;letter-spacing:.3em;text-align:center;border:2px solid var(--line);border-radius:12px;background:var(--surface-2);padding:8px}
.pin-entry input:focus{border-color:var(--ink);outline:none}
.err{color:var(--danger);font-size:13.5px;margin:0;min-height:1em}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:7px 11px;margin:0}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(86vw,340px);background:var(--surface);z-index:21;display:flex;flex-direction:column;
  padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;gap:6px;overflow:auto;box-shadow:var(--shadow)}
.dr-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dr-head b{display:block;font-family:var(--f-display);font-stretch:90%;font-size:20px;font-weight:750}
.dr-head small{color:var(--muted);font-size:12.5px}
.dr-item{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 4px;border-radius:10px;text-align:left;font-weight:600;font-size:15.5px;width:100%}
.dr-item:hover{background:var(--surface-2)}
.dr-item svg{flex:none;color:var(--muted)}
.dr-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.page{position:fixed;inset:0;background:var(--bg);z-index:22;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.page-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:1}
.page-h h2{font-family:var(--f-display);font-stretch:90%;font-size:20px;font-weight:750;margin:0}
.icon-btn{width:42px;height:42px;border:0;border-radius:50%;background:none;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}
.page-b{max-width:560px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.list-row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row div{flex:1;min-width:0}
.list-row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row small{display:block;color:var(--muted);font-size:12.5px}
.list-row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;flex:none}
.list-row .amt small{font-weight:400}
.meter{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.hot{background:var(--signal)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}

/* ---------- Panel de flota ---------- */
.fleet{min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-stretch:88%;font-weight:800;font-size:20px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.note{margin:0;padding-block:12px;color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{font-family:var(--f-display);font-stretch:88%;font-weight:750;font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
@media (max-width:900px){.fgrid{grid-template-columns:1fr}}

const onGrid=v=>Math.abs(v*2-Math.round(v*2))<1e-6;
function route(a,b){
  const pts=[{x:a.x,y:a.y}]; let c={x:a.x,y:a.y};
  if(!onGrid(c.y)){c={x:c.x,y:Math.round(c.y*2)/2};pts.push(c);}
  else if(!onGrid(c.x)){c={x:Math.round(c.x*2)/2,y:c.y};pts.push(c);}
  if((c.x<RIVER)!==(b.x<RIVER)) pts.push({x:c.x,y:BRIDGE_Y},{x:b.x,y:BRIDGE_Y});
  else pts.push({x:b.x,y:c.y});
  pts.push({x:b.x,y:b.y});
  const out=[pts[0]];
  for(const p of pts){const q=out[out.length-1]; if(man(p,q)>1e-6) out.push({x:p.x,y:p.y});}
  return out;
}
const plen=p=>{let s=0;for(let i=1;i<p.length;i++)s+=man(p[i-1],p[i]);return s;};
function advance(d,dist){
  while(dist>0&&d.path.length>1){
    const t=d.path[1],dx=t.x-d.x,dy=t.y-d.y,L=Math.hypot(dx,dy);
    if(L>1e-9)d.h=Math.atan2(dy,dx);
    if(dist>=L){d.x=t.x;d.y=t.y;d.path.shift();dist-=L;}
    else{d.x+=dx/L*dist;d.y+=dy/L*dist;dist=0;}
    d.path[0]={x:d.x,y:d.y};
  }
}
function estimate(a,b,cat){

  let fare=Math.max(sub*CATS[cat].mult, f.minFare*CATS[cat].mult);
  fare=Math.round(fare/5)*5;
  return {km,min,fare,base,kmC,minC,adj:fare-sub};
}

function settle(d,t,silent){
  const v=veh(d), share=t.fare*(1-t.comm/100), comm=t.fare*t.comm/100;
  d.earn+=share; d.trips++;
  if(t.pay==='cash') d.balance+=comm; else d.balance-=share;
  if(t.corp){const c=corp(t.corp); c.used+=t.fare; c.trips++;}
  v.odo+=t.km+(t.pickupKm||0);
  if(!silent) checkMaint(v);
}
function checkMaint(v){
  if(!v.maint&&!v.alerted&&v.odo>=v.next-500){
    v.alerted=true;
    addAlert('maint',`Mantenimiento próximo · ${v.plate}`,`${v.model}: ${Math.round(v.odo).toLocaleString('en-US')} km de ${v.next.toLocaleString('en-US')} km`);
  }
}

function createTrip(o){

    created:now(),rejected:[],offerTo:null,offerAt:0,driverId:null,prefer:o.prefer||null,synthetic:!!o.synthetic,paxRating:(4.6+Math.random()*0.4).toFixed(1)};

function accept(d,t){

function cancelTrip(t,by){

  if(t.pay==='card') return `<b>Tarjeta •••• ${PAX[t.paxId]?.card||'4242'}</b> · cobro aprobado (simulado)`;

function tick(dt){
  const T=now();
  for(const t of S.trips){
    if(t.status!=='searching') continue;
    if(t.offerTo){
      const d=drv(t.offerTo);
      if(!d||!d.online||d.status!=='idle'){t.rejected.push(t.offerTo);t.offerTo=null;}
      else if(d.id===S.ctrl){ if(T>t.offerAt+15000){t.rejected.push(d.id);t.offerTo=null;log(`${first(d.name)} no respondió a ${t.id}; pasa al siguiente`);} }
      else if(T>t.offerAt+1500) accept(d,t);
    }
    if(t.status==='searching'&&!t.offerTo){
      const busy=new Set(S.trips.filter(o=>o.status==='searching'&&o.offerTo).map(o=>o.offerTo));
      const ok=d=>d&&d.online&&d.status==='idle'&&!busy.has(d.id)&&!veh(d).maint&&veh(d).cat===t.cat&&!t.rejected.includes(d.id);
      let c=null;
      if(t.prefer&&ok(drv(t.prefer))) c=drv(t.prefer);
      else c=S.drivers.filter(ok).sort((a,b)=>man(a,t.from)-man(b,t.from))[0];
      if(c){t.offerTo=c.id;t.offerAt=T;}
      else if(T-t.created>25000){t.status='nodriver';log(`${t.id} sin conductores disponibles`);}
    }
  }
  for(const d of S.drivers){
    if(!d.online&&d.status==='idle') continue;
    if(d.status==='idle'){
      if(d.path.length<=1&&Math.random()<dt*0.25){
        const side=d.x<RIVER;
        let nx=Math.round((d.x+rand(-1.2,1.2))*2)/2, ny=Math.round((d.y+rand(-1.2,1.2))*2)/2;
        nx=Math.min(BOUNDS.x1-.5,Math.max(BOUNDS.x0+.5,nx)); ny=Math.min(8.5,Math.max(1,ny));
        if(side&&nx>11)nx=11; if(!side&&nx<11.5)nx=11.5;
        d.path=route(d,{x:nx,y:ny});
      }
      advance(d,WANDER*dt); continue;
    }
    advance(d,SPEED*dt);
    const t=trip(d.tripId); if(!t){d.status='idle';continue;}
    if(d.status==='toPickup'&&d.path.length<=1){d.status='atPickup';t.status='arrived';t.arrivedAt=T;log(`${first(d.name)} llegó a ${t.from.name} (${t.id})`);}
    else if(d.status==='atPickup'&&d.id!==S.ctrl&&T-t.arrivedAt>3500) startTrip(d,t);
    else if(d.status==='onTrip'&&d.path.length<=1){ if(d.id===S.ctrl) d.atDest=true; else completeTrip(d,t); }
  }
  if(S.role==='drv'){
    const d=drv(S.ctrl);
    if(d.online&&d.status==='idle'&&!offerFor(d)&&T>S.nextMine){
      S.nextMine=T+rand(9000,14000);
      const near=PLACES.slice().sort((a,b)=>man(a,d)-man(b,d)).slice(0,3), from=pick(near);
      const to=pick(PLACES.filter(p=>p!==from&&man(p,from)>1.5)), r=Math.random(), pay=r<.45?'cash':r<.85?'card':'corp';
      createTrip({paxName:pick(NAMES),from,to,cat:veh(d).cat,pay,corp:pay==='corp'?pick(S.corps).id:null,synthetic:true,prefer:d.id});
    }
  }
  if(T>S.nextSynth){
    S.nextSynth=T+rand(9000,15000);
    const idle=S.drivers.filter(d=>d.online&&d.status==='idle'&&!veh(d).maint&&d.id!==S.ctrl);
    if(idle.length>=3){
      const d0=pick(idle), from=pick(PLACES), to=pick(PLACES.filter(p=>p!==from)), r=Math.random(), pay=r<.45?'cash':r<.85?'card':'corp';
      createTrip({paxName:pick(NAMES),from,to,cat:veh(d0).cat,pay,corp:pay==='corp'?pick(S.corps).id:null,synthetic:true,prefer:d0.id});
    }
  }
}

let C={};
function readTokens(){
  const cs=getComputedStyle(document.documentElement);
  for(const k of ['land','street','avenue','sea','river','label','accent','signal','ok','muted','ink','surface','danger']) C[k]=cs.getPropertyValue('--'+k).trim();

function drawMap(cv,o,dt){
  const W=cv.clientWidth,H=cv.clientHeight; if(!W||!H) return;
  const dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const ins=o.inset||{l:0,t:0,r:0,b:0}, AW=Math.max(60,W-ins.l-ins.r), AH=Math.max(60,H-ins.t-ins.b);
  const CX=ins.l+AW/2, CY=ins.t+AH/2;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const p of o.focus){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);}
  const pad=o.pad??0.7, bw=Math.max(x1-x0+pad*2,o.minSpan), bh=Math.max(y1-y0+pad*2,o.minSpan*0.5);
  const ts=Math.min(AW/bw,AH/bh,140), tcx=(x0+x1)/2, tcy=(y0+y1)/2;
  const cam=cv._cam||(cv._cam={s:ts,cx:tcx,cy:tcy});
  const k=o.instant?1:1-Math.exp(-dt*3);
  cam.s+=(ts-cam.s)*k; cam.cx+=(tcx-cam.cx)*k; cam.cy+=(tcy-cam.cy)*k;
  const s=cam.s, X=x=>CX+(x-cam.cx)*s, Y=y=>CY-(y-cam.cy)*s;
  const wx0=cam.cx-CX/s, wx1=cam.cx+(W-CX)/s, wy0=cam.cy-(H-CY)/s, wy1=cam.cy+CY/s;
  g.fillStyle=C.land; g.fillRect(0,0,W,H);
  g.strokeStyle=C.street; g.lineWidth=Math.max(1,s*0.05); g.beginPath();
  for(let x=Math.floor(wx0*2)/2;x<=wx1;x+=.5){g.moveTo(X(x),0);g.lineTo(X(x),H);}
  for(let y=Math.floor(wy0*2)/2;y<=wy1;y+=.5){g.moveTo(0,Y(y));g.lineTo(W,Y(y));}
  g.stroke();
  g.strokeStyle=C.avenue; g.lineWidth=Math.max(2.5,s*0.1); g.beginPath();
  for(const a of AVES_H){g.moveTo(0,Y(a.y));g.lineTo(W,Y(a.y));}
  for(const a of AVES_V){g.moveTo(X(a.x),0);g.lineTo(X(a.x),H);}
  g.stroke();
  g.fillStyle=C.sea; g.beginPath(); g.moveTo(0,H);
  for(let px=0;px<=W+6;px+=6) g.lineTo(px,Y(seaY(wx0+px/s)));
  g.lineTo(W,H); g.closePath(); g.fill();
  g.strokeStyle=C.river; g.lineWidth=Math.max(5,s*0.32); g.lineCap='butt'; g.beginPath();
  const sy=seaY(RIVER)-.2; g.moveTo(X(RIVER+0.09*Math.sin(sy*1.7)),Y(sy));
  for(let y=sy;y<=Math.max(wy1,9.5);y+=.1) g.lineTo(X(RIVER+0.09*Math.sin(y*1.7)),Y(y));
  g.stroke();
  g.strokeStyle=C.avenue; g.lineWidth=Math.max(2.5,s*0.1); g.beginPath(); g.moveTo(X(RIVER-.45),Y(BRIDGE_Y)); g.lineTo(X(RIVER+.45),Y(BRIDGE_Y)); g.stroke();
  g.textBaseline='middle';
  if(s>34){
    g.font='600 10px Inter, system-ui, sans-serif'; g.fillStyle=C.label; g.globalAlpha=.75;
    for(const a of AVES_H){ if(a.y>wy0&&a.y<wy1) g.fillText(a.n,Math.max(ins.l+8,X(BOUNDS.x0+.3)),Y(a.y)-7); }
    g.globalAlpha=1;
  }
  if(s>22){
    g.font='600 11px Inter, system-ui, sans-serif';
    for(const p of PLACES){ if(p.x<wx0-1||p.x>wx1+1||p.y<wy0-1||p.y>wy1+1) continue;
      g.fillStyle=C.label; g.beginPath(); g.arc(X(p.x),Y(p.y),2.4,0,7); g.fill();
      g.fillText(p.name,X(p.x)+5,Y(p.y)+9); }
    g.font='italic 600 10.5px Inter, system-ui, sans-serif'; g.globalAlpha=.6;
    g.fillText('Mar Caribe',X(Math.max(wx0+.3,5)),Y(seaY(5))+16); g.fillText('Río Ozama',X(RIVER)+9,Y(Math.min(wy1-.6,7.5)));
    g.globalAlpha=1;
  }
  g.lineCap='round'; g.lineJoin='round';
  for(const r of o.routes||[]){
    if(!r.pts||r.pts.length<2) continue;
    g.strokeStyle=r.color; g.lineWidth=r.w||4; g.setLineDash(r.dash||[]); g.globalAlpha=r.alpha??1;
    g.beginPath(); r.pts.forEach((p,i)=>i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y))); g.stroke();
  }
  g.setLineDash([]); g.globalAlpha=1;
  for(const p of o.pins||[]){
    const px=X(p.x),py=Y(p.y);
    if(p.kind==='o'){g.fillStyle=C.surface;g.strokeStyle=C.accent;g.lineWidth=4;g.beginPath();g.arc(px,py,7,0,7);g.fill();g.stroke();}
    else if(p.kind==='me'){g.fillStyle=C.accent;g.globalAlpha=.2;g.beginPath();g.arc(px,py,20,0,7);g.fill();g.globalAlpha=1;g.strokeStyle=C.surface;g.lineWidth=3;g.beginPath();g.arc(px,py,8,0,7);g.fill();g.stroke();}
    else{g.fillStyle=C.ink;g.fillRect(px-7,py-7,14,14);g.fillStyle=C.surface;g.fillRect(px-2.5,py-2.5,5,5);}
  }
  for(const c of o.cars||[]){
    const px=X(c.x),py=Y(c.y), L=c.hl?22:15, Wd=c.hl?11:8;
    if(c.hl){g.fillStyle=c.color;g.globalAlpha=.18;g.beginPath();g.arc(px,py,20,0,7);g.fill();g.globalAlpha=1;}
    g.save(); g.translate(px,py); g.rotate(-c.h);
    g.fillStyle=c.color; g.strokeStyle=C.surface; g.lineWidth=1.8;
    g.beginPath(); g.roundRect?g.roundRect(-L/2,-Wd/2,L,Wd,3):g.rect(-L/2,-Wd/2,L,Wd); g.fill(); g.stroke();
    g.fillStyle=C.surface; g.globalAlpha=.8; g.fillRect(L/2-L*.32,-Wd/2+2,L*.16,Wd-4); g.globalAlpha=1;
    g.restore();
  }
}

const paxTrip=()=>S.pax.tripId&&trip(S.pax.tripId);
const activePaxTrip=()=>{const t=paxTrip();return t&&['searching','assigned','arrived','ongoing'].includes(t.status);};
let etaCache={k:'',t:0,v:null};
function catEtas(from){
  if(etaCache.k===from.id&&now()-etaCache.t<5000) return etaCache.v;
  const r={};
  for(const k in CATS){
    const c=S.drivers.filter(d=>d.online&&d.status==='idle'&&veh(d).cat===k&&!veh(d).maint);
    r[k]=c.length?mins(Math.min(...c.map(d=>man(d,from)))):null;
  }
  etaCache={k:from.id,t:now(),v:r}; return r;
}
function payOpts(){
  const prof=PAX[S.who], o=[{k:'card',l:'Tarjeta •••• '+prof.card},{k:'cash',l:'Efectivo'}];
  if(prof.corp) o.unshift({k:'corp',l:'Corporativa · '+corp(prof.corp).name});
  return o;
}
function suggHTML(){
  const p=S.pax,q=norm(p.q.trim()), from=P[p.from];
  const rec=new Set(S.trips.filter(t=>t.paxId===S.who&&t.status==='completed').map(t=>t.to.id));
  let list=PLACES.filter(pl=>pl.id!==p.from&&(!q||norm(pl.name+' '+pl.sub).includes(q)));
  if(!q) list.sort((a,b)=>(rec.has(b.id)?1:0)-(rec.has(a.id)?1:0));
  list=list.slice(0,q?6:5);
  if(!list.length) return `<p class="empty">No encontramos “${esc(p.q)}”. Prueba con un sector o una avenida.</p>`;
  return list.map(pl=>`<button class="sugg-item" data-act="pax-dest" data-arg="${pl.id}"><span class="s-ic">${rec.has(pl.id)&&!q?I.clock:I.pin}</span><span><b>${esc(pl.name)}</b><small>${esc(pl.sub)} · ${plen(route(from,pl)).toFixed(1)} km</small></span></button>`).join('');
}
function routeBox(a,b,extra){

    <div class="rt-row"><span class="dot d"></span><div style="min-width:0"><small>Destino</small><b>${esc(b.name)}</b></div></div>

}
const carSvg=k=>{const w=k==='xl'?42:k==='confort'?38:34;return `<svg width="${w}" height="22" viewBox="0 0 ${w} 22" aria-hidden="true"><path d="M3 15v-3l4-5.5h${w-16}l5 5.5h1a2 2 0 0 1 2 2v1z" fill="currentColor"/><circle cx="9.5" cy="16" r="3.2" fill="var(--surface)" stroke="currentColor" stroke-width="2"/><circle cx="${w-9.5}" cy="16" r="3.2" fill="var(--surface)" stroke="currentColor" stroke-width="2"/></svg>`;};

function setLive(k,v,prop){document.querySelectorAll(`[data-live="${k}"]`).forEach(el=>{if(prop==='w')el.style.width=v;else if(el.textContent!==v)el.textContent=v;});}
function live(){
  if(S.role==='pax'){
    const t=paxTrip();
    if(t&&t.driverId){const d=drv(t.driverId),rem=plen(d.path);setLive('pax-eta',mins(rem)+' min');
      if(t.status==='ongoing')setLive('pax-prog',Math.min(100,Math.max(0,(1-rem/t.km)*100)).toFixed(1)+'%','w');}
  }
  if(S.role==='drv'){
    const d=drv(S.ctrl), offer=offerFor(d);
    if(offer){const left=Math.max(0,15000-(now()-offer.offerAt));setLive('offer-sec',Math.ceil(left/1000)+' s');setLive('offer-bar',(left/150).toFixed(1)+'%','w');}
    const t=d.tripId&&trip(d.tripId);
    if(t){const rem=plen(d.path);setLive('drv-eta',mins(rem)+' min');setLive('drv-km',rem.toFixed(1)+' km');
      if(d.status==='onTrip')setLive('drv-prog',Math.min(100,(1-rem/t.km)*100).toFixed(1)+'%','w');}
  }
}

  const d=drv(S.ctrl),v=veh(d),offer=offerFor(d),t=d.tripId&&trip(d.tripId);
  const done=S.drvDone&&now()-S.drvDone.at<15000?S.drvDone.id:'';
  return ['d',d.id,d.online,d.status,offer?offer.id:'',t?t.id+t.status:'',d.atDest,done,Math.round(d.earn),d.trips,Math.round(d.balance),v.maint].join('|');
}
function renderApp(force){
  const k=sheetKey();
  if(force||k!==sk){
    const sh=$('#sheet');
    sh.innerHTML=!S.role?startHTML():S.role==='pax'?paxHTML():drvHTML();
    sh.classList.toggle('fit',!S.role||S.role==='drv'||!!paxTrip()||!!S.pax.to);
    sk=k;
  }
  $('#menu-btn').hidden=!S.role;
  const e=$('#earn');
  if(S.role==='drv'){const d=drv(S.ctrl);e.hidden=false;const txt=money(d.earn);if(e.dataset.v!==txt){e.innerHTML=`${txt}<small>hoy</small>`;e.dataset.v=txt;}}
  else e.hidden=true;
  live();
}
function openMenu(){S.menu=true;$('#drawer').innerHTML=drawerHTML();$('#drawer').hidden=false;$('#scrim').hidden=false;}
function closeMenu(){S.menu=false;$('#drawer').hidden=true;$('#scrim').hidden=true;}
function openPage(k){closeMenu();S.page=k;$('#page').innerHTML=pageHTML(k);$('#page').hidden=false;}
function closePage(){S.page=null;$('#page').hidden=true;}

function kpis(){
  const done=S.trips.filter(t=>t.status==='completed'&&!t.old), gross=done.reduce((s,t)=>s+t.fare,0), comm=done.reduce((s,t)=>s+t.fare*t.comm/100,0);
  const on=S.drivers.filter(d=>d.online).length, busy=S.drivers.filter(d=>d.online&&d.status!=='idle').length;
  const owed=S.drivers.reduce((s,d)=>s+Math.max(0,d.balance),0), search=S.trips.filter(t=>t.status==='searching').length;
  return [['Conductores conectados',`${on}<em> / ${S.drivers.length}</em>`],['En servicio ahora',`${busy}<em>${search?' · '+search+' buscando':''}</em>`],['Viajes completados hoy',done.length],['Facturación hoy',money(gross)],['Comisión de plataforma',money(comm)],['Saldo por cobrar',money(owed)]]
    .map(([l,v])=>`<div class="kpi"><small>${l}</small><b>${v}</b></div>`).join('');
}
function drvState(d){
  if(veh(d).maint&&!d.online) return ['Vehículo en taller','p-bad'];
  if(!d.online) return ['Desconectado','p-off'];
  if(offerFor(d)) return ['Recibiendo oferta','p-acc'];
  return {idle:['Disponible','p-ok'],toPickup:['Va a recoger','p-busy'],atPickup:['Esperando pasajero','p-busy'],onTrip:['En viaje','p-busy']}[d.status];
}
function vehRows(){
  return `<div class="tbl-wrap"><table><thead><tr><th>Placa</th><th>Vehículo</th><th>Categoría</th><th>Conductor</th><th>Estado</th><th class="r">Odómetro</th><th class="r">Próx. servicio</th><th></th></tr></thead><tbody>${
    S.vehicles.map(v=>{const d=S.drivers.find(x=>x.vid===v.id); let st;
      if(v.maint) st=['En taller','p-bad']; else if(!d) st=['Sin conductor','p-off']; else if(!d.online) st=['Estacionado','p-off']; else if(d.status==='idle') st=['Disponible','p-ok']; else st=['En servicio','p-busy'];
      const near=!v.maint&&v.odo>=v.next-500;
      const act=v.maint?`<button class="btn ghost sm" data-act="veh-return" data-arg="${v.id}">Volver a servicio</button>`:d?`<button class="btn ghost sm" data-act="veh-maint" data-arg="${v.id}">Enviar a taller</button>`:'<span class="muted">Disponible para alquiler</span>';
      return `<tr><td><span class="plate">${esc(v.plate)}</span></td><td>${esc(v.model)} · ${esc(v.color)}</td><td>${CATS[v.cat].name}</td><td>${d?esc(d.name):'—'}</td><td><span class="pill ${st[1]}">${st[0]}</span></td><td class="r">${Math.round(v.odo).toLocaleString('en-US')} km</td><td class="r">${v.next.toLocaleString('en-US')} km ${near?'<span class="pill p-busy">Pronto</span>':''}</td><td class="r">${act}</td></tr>`;}).join('')
  }</tbody></table></div>`;
}
function drvRows(){
  return `<div class="tbl-wrap"><table><thead><tr><th>Conductor</th><th>Vehículo</th><th>Estado</th><th class="r">Viajes hoy</th><th class="r">Ganado hoy</th><th class="r">Calificación</th><th class="r">Alquiler semanal</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${
    S.drivers.map(d=>{const v=veh(d),st=drvState(d);
      return `<tr><td><b>${esc(d.name)}</b></td><td><span class="plate">${esc(v.plate)}</span></td><td><span class="pill ${st[1]}">${st[0]}</span></td><td class="r">${d.trips}</td><td class="r">${money(d.earn)}</td><td class="r">★ ${d.rating.toFixed(2)}</td><td class="r">${money(d.rent)}</td><td class="r ${d.balance>0?'owe':'cred'}">${d.balance>0?'Debe ':'A favor '}${money(Math.abs(d.balance))}</td><td class="r"><button class="btn ghost sm" data-act="pay-open" data-arg="${d.id}">Registrar pago</button></td></tr>`;}).join('')
  }</tbody></table></div>`;
}
const tripSt={searching:['Buscando','p-acc'],assigned:['Asignado','p-busy'],arrived:['En recogida','p-busy'],ongoing:['En curso','p-busy'],completed:['Completado','p-ok'],cancelled:['Cancelado','p-off'],nodriver:['Sin conductor','p-bad']};
function tripRows(){
  return `<div class="tbl-wrap"><table><thead><tr><th>Viaje</th><th>Hora</th><th>Pasajero</th><th>Ruta</th><th>Conductor</th><th>Categoría</th><th>Pago</th><th class="r">Monto</th><th>Estado</th></tr></thead><tbody>${
    S.trips.filter(t=>!t.old).slice(0,40).map(t=>{const d=t.driverId&&drv(t.driverId),st=tripSt[t.status];
      return `<tr><td>${t.id}</td><td>${clock(t.created)}</td><td>${esc(t.paxName)}${t.corp?' <span class="pill p-acc">Corp.</span>':''}</td><td>${esc(t.from.name)} → ${esc(t.to.name)}</td><td>${d?esc(d.name):'—'}</td><td>${CATS[t.cat].name}</td><td>${payShort(t)}</td><td class="r">${money(t.fare)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td></tr>`;}).join('')
  }</tbody></table></div>`;
}
function corpRows(){
  return `<div class="tbl-wrap"><table><thead><tr><th>Empresa</th><th class="r">Usuarios</th><th class="r">Viajes del mes</th><th class="r">Consumo</th><th class="r">Límite mensual</th><th>Uso</th></tr></thead><tbody>${
    S.corps.map(c=>{const pct=Math.min(100,c.used/c.limit*100);
      return `<tr><td><b>${esc(c.name)}</b></td><td class="r">${c.users}</td><td class="r">${c.trips}</td><td class="r">${money(c.used)}</td><td class="r">${money(c.limit)}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar"><i class="${pct>75?'hot':''}" style="width:${pct.toFixed(1)}%"></i></div><span>${pct.toFixed(0)}%</span></div></td></tr>`;}).join('')
  }</tbody></table></div><p class="fine" style="padding:10px 16px 14px">Los viajes corporativos se facturan a la empresa a fin de mes. En la app, la cuenta de Pedro Ramírez pertenece a Constructora Caribe Norte.</p>`;
}
function faresHTML(){
  const f=S.fares, fld=(id,l,v)=>`<label class="field"><span class="lbl">${l}</span><input id="tf-${id}" type="number" min="0" step="1" value="${v}"></label>`;
  return `<div class="tarifas"><div style="display:flex;flex-direction:column;gap:14px">
    <div class="tf-grid">${fld('base','Tarifa base (RD$)',f.base)}${fld('km','Por kilómetro (RD$)',f.km)}${fld('min','Por minuto (RD$)',f.min)}${fld('minFare','Tarifa mínima (RD$)',f.minFare)}${fld('comm','Comisión de plataforma (%)',f.comm)}</div>
    <p class="fine">Multiplicadores por categoría: Económico ×1.00 · Confort ×1.35 · XL ×1.70. Los cambios aplican a viajes nuevos.</p>
    <div><button class="btn primary" data-act="fares-save">Guardar tarifas</button></div></div>
    <div class="preview" id="tf-preview"></div></div>`;
}
function readFares(){const g=id=>Math.max(0,Number($('#tf-'+id).value)||0);return {base:g('base'),km:g('km'),min:g('min'),minFare:g('minFare'),comm:Math.min(50,g('comm'))};}
function faresPreview(){
  const el=$('#tf-preview'); if(!el) return;
  const vals=readFares(), keep=S.fares; S.fares=vals;
  const a=P.piantini,b=P.colonial;
  el.innerHTML=`<span class="eyebrow">Vista previa · Piantini → Zona Colonial</span><span class="muted">${plen(route(a,b)).toFixed(1)} km · ${estimate(a,b,'eco').min} min</span>`+Object.keys(CATS).map(k=>`<div><span>${CATS[k].name}</span><b>${money(estimate(a,b,k).fare)}</b></div>`).join('')+`<div><span class="muted">Conductor recibe en Económico</span><b>${money(estimate(a,b,'eco').fare*(1-vals.comm/100))}</b></div>`;
  S.fares=keep;
}
function alertsHTML(){
  const a=S.alerts.filter(x=>!x.resolved).slice(0,6);
  if(!a.length) return '<p class="muted" style="font-size:13px">Sin alertas abiertas.</p>';
  return a.map(x=>`<div class="alert ${x.type}"><div><b>${esc(x.title)}</b><small>${clock(x.t)} · ${esc(x.text)}</small></div><button class="btn ghost sm" data-act="alert-ok" data-arg="${x.id}">${x.type==='sos'?'Atendida':'Entendido'}</button></div>`).join('');
}
let lastFleet='',lastFtab='';
function renderFleet(force){
  $('#kpis').innerHTML=kpis();
  const ak=S.alerts.map(a=>a.id+a.resolved).join(); if(force||ak!==$('#alerts').dataset.k){$('#alerts').innerHTML=alertsHTML();$('#alerts').dataset.k=ak;}
  const fk=String(S.feed.length+(S.feed[0]?.t||0)); if(force||fk!==$('#feed').dataset.k){$('#feed').innerHTML=S.feed.slice(0,30).map(f=>`<p><time>${clock(f.t)}</time><span>${esc(f.text)}</span></p>`).join('');$('#feed').dataset.k=fk;}
  const box=$('#ftab');
  if(S.ftab==='fares'){ if(force||lastFtab!=='fares'){box.innerHTML=faresHTML();faresPreview();} lastFtab='fares'; return; }
  const html=S.ftab==='veh'?vehRows():S.ftab==='drv'?drvRows():S.ftab==='trips'?tripRows():corpRows();
  if(force||html!==lastFleet||lastFtab!==S.ftab){box.innerHTML=html;lastFleet=html;}
  lastFtab=S.ftab;
}

let mode='app';
function setMode(m){
  mode=m; $('#app').hidden=m!=='app'; $('#fleet').hidden=m!=='fleet';
  document.body.classList.toggle('app-mode',m==='app');
  try{ if(m==='fleet'&&location.hash!=='#flota') history.replaceState(null,'','#flota');
       if(m==='app'&&location.hash==='#flota') history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(m==='fleet'){closeMenu();closePage();renderFleet(true);window.scrollTo(0,0);} else {camReset();renderApp(true);}
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

const A={
  start:v=>{S.start=v||null;},
  login:v=>{const [r,id]=v.split(':');login(r,id);},
  logout:()=>{closeMenu();logout();},
  menu:()=>openMenu(),
  'menu-close':()=>closeMenu(),
  page:k=>openPage(k),
  'page-close':()=>closePage(),
  switch:()=>{closeMenu();const to=S.role==='pax'?'drv':'pax';if(logout())S.start=to;},
  'go-fleet':()=>setMode('fleet'),
  'go-app':()=>setMode('app'),
  reset:()=>{closeMenu();closePage();init();camReset();renderApp(true);if(mode==='fleet')renderFleet(true);toast('Demo reiniciada con los datos de ejemplo');},
  'pax-dest':id=>{S.pax.to=id;S.pax.q='';},
  'pax-change':()=>{S.pax.to=null;},
  'pax-cat':k=>{S.pax.cat=k;},
  'pax-pay':k=>{S.pax.pay=k;if(S.page==='wallet'){$('#page').innerHTML=pageHTML('wallet');toast('Forma de pago actualizada');}},
  'pax-request':()=>{const p=S.pax,prof=PAX[S.who];const t=createTrip({paxId:prof.id,paxName:prof.name,from:P[p.from],to:P[p.to],cat:p.cat,pay:p.pay,corp:p.pay==='corp'?prof.corp:null});p.tripId=t.id;p.rating=5;p.tip=0;},
  'pax-retry':()=>{const o=paxTrip();const t=createTrip({paxId:o.paxId,paxName:o.paxName,from:o.from,to:o.to,cat:o.cat,pay:o.pay,corp:o.corp});S.pax.tripId=t.id;},
  'pax-cancel':()=>{const t=paxTrip(); if(t&&t.status!=='ongoing') cancelTrip(t,'el pasajero');},
  'pax-done':()=>{S.pax.tripId=null;},
  'pax-share':()=>toast('Seguimiento en vivo compartido (simulado)'),
  'pax-sos':()=>{const t=paxTrip(),d=drv(t.driverId);addAlert('sos',`SOS · viaje ${t.id}`,`${t.paxName} con ${d.name} (${veh(d).plate}) cerca de ${t.status==='ongoing'?'ruta a '+t.to.name:t.from.name}`);log(`SOS activado en ${t.id}`);toast('Alerta enviada a la central de la flota');},
  'pax-star':n=>{S.pax.rating=+n;},
  'pax-tip':n=>{S.pax.tip=+n;},
  'pax-finish':()=>{const t=paxTrip(),d=drv(t.driverId),p=S.pax;t.rating=p.rating;t.tip=t.pay==='cash'?0:p.tip;d.rating=(d.rating*200+p.rating)/201;
    if(t.tip){d.earn+=t.tip;d.balance-=t.tip;log(`Propina de ${money(t.tip)} para ${first(d.name)} (${t.id})`);}
    p.tripId=null;p.to=null;p.from=t.to.id;camReset();toast('Gracias por calificar');},
  'drv-online':()=>{const d=drv(S.ctrl);if(veh(d).maint)return toast('Tu vehículo está en el taller');d.online=true;d.status='idle';S.nextMine=now()+4000;log(`${first(d.name)} se conectó`);},
  'drv-offline':()=>{const d=drv(S.ctrl);if(d.status!=='idle')return;d.online=false;log(`${first(d.name)} se desconectó`);},
  'drv-accept':id=>{const t=trip(id),d=drv(S.ctrl);if(t&&t.status==='searching'&&t.offerTo===d.id)accept(d,t);},
  'drv-reject':id=>{const t=trip(id),d=drv(S.ctrl);if(t&&t.offerTo===d.id){t.rejected.push(d.id);t.offerTo=null;S.nextMine=now()+rand(7000,11000);log(`${first(d.name)} rechazó ${t.id}`);}},
  'drv-start':()=>{const d=drv(S.ctrl),t=trip(d.tripId),v=($('#drv-pin').value||'').trim();
    if(v!==t.pin){$('#drv-pin-msg').textContent=v.length<4?'Escribe los 4 dígitos del PIN.':'El PIN no coincide. Pídeselo de nuevo al pasajero.';return;}
    startTrip(d,t);},
  'drv-finish':()=>{const d=drv(S.ctrl),t=trip(d.tripId);if(d.atDest)completeTrip(d,t);},
  'drv-call':()=>toast('Llamada con número enmascarado (simulada)'),
  ftab:k=>{S.ftab=k;document.querySelectorAll('#subtabs button').forEach(b=>b.classList.toggle('on',b.dataset.arg===k));renderFleet(true);},
  'veh-maint':id=>{const v=S.vehicles.find(x=>x.id===id),d=S.drivers.find(x=>x.vid===id);
    if(d&&d.status!=='idle')return toast('Espera a que termine el viaje en curso');
    v.maint=true;if(d)d.online=false;log(`${v.plate} enviado al taller`);renderFleet(true);toast(`${v.plate} en taller; su conductor quedó desconectado`);},
  'veh-return':id=>{const v=S.vehicles.find(x=>x.id===id);v.maint=false;v.next=Math.ceil((v.odo+5000)/1000)*1000;v.alerted=false;
    S.alerts.forEach(a=>{if(a.type==='maint'&&a.title.includes(v.plate))a.resolved=true;});log(`${v.plate} volvió a servicio`);renderFleet(true);toast(`${v.plate} listo. Próximo servicio a ${v.next.toLocaleString('en-US')} km`);},
  'pay-open':id=>{S.modal=id;const d=drv(id),m=$('#modal');
    m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pm-t"><h3 id="pm-t">Registrar pago</h3><p class="muted">${esc(d.name)} · ${d.balance>0?'debe '+money(d.balance):'saldo a favor '+money(-d.balance)}</p>
      <label class="field"><span class="lbl">Monto (RD$)</span><input id="pm-amt" type="number" min="1" step="1" value="${Math.max(0,Math.round(d.balance))||''}"></label>
      <label class="field"><span class="lbl">Método</span><select id="pm-met"><option>Efectivo en oficina</option><option>Transferencia bancaria</option><option>Descuento de liquidación</option></select></label>
      <p class="err" id="pm-err"></p>
      <div class="row-actions"><button class="btn ghost" data-act="pay-close">Cancelar</button><button class="btn primary" data-act="pay-save">Guardar pago</button></div></div>`;
    m.hidden=false;$('#pm-amt').focus();},
  'pay-close':()=>{$('#modal').hidden=true;S.modal=null;},
  'pay-save':()=>{const d=drv(S.modal),amt=Number($('#pm-amt').value);if(!(amt>0)){$('#pm-err').textContent='Escribe un monto mayor que cero.';return;}
    d.balance-=amt;log(`Pago de ${money(amt)} de ${first(d.name)} · ${$('#pm-met').value}`);$('#modal').hidden=true;S.modal=null;renderFleet(true);toast(`Pago de ${money(amt)} registrado`);},
  'alert-ok':id=>{const a=S.alerts.find(x=>x.id===id);if(a)a.resolved=true;renderFleet(true);},
  'fares-save':()=>{S.fares=readFares();log(`Tarifas actualizadas · base ${money(S.fares.base)}, ${money(S.fares.km)}/km, comisión ${S.fares.comm}%`);toast('Tarifas guardadas. Aplican a viajes nuevos.');},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=A[b.dataset.act]; if(f){f(b.dataset.arg);if(mode==='app')renderApp();}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')A['pay-close']();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)A['pay-close']();else if(S.page)closePage();else if(S.menu)closeMenu();}
  if(e.key==='Enter'&&e.target.id==='drv-pin'){A['drv-start']();renderApp();}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='pax-q'){S.pax.q=e.target.value;$('#pax-sugg').innerHTML=suggHTML();}
  if(id&&id.startsWith('tf-'))faresPreview();
  if(id==='drv-pin'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);$('#drv-pin-msg').textContent='';}
});
document.addEventListener('change',e=>{
  if(e.target.id==='pax-from'){S.pax.from=e.target.value;camReset();renderApp(true);}
});
window.addEventListener('hashchange',()=>setMode(location.hash==='#flota'?'fleet':'app'));

init(); readTokens(); setMode(location.hash==='#flota'?'fleet':'app');
let last=performance.now(), tokT=0, fleetT=0;
function loop(ts){
  const dt=Math.min(0.1,Math.max(0,(ts-last)/1000)); last=ts;
  tick(dt);
  tokT+=dt; if(tokT>0.6){tokT=0;readTokens();}
  if(mode==='app'){ renderApp(); if(!S.page) appMap(dt); }
  else {
    fleetMap();
    fleetT+=dt; if(fleetT>1){fleetT=0; const a=document.activeElement; if(!S.modal&&!(a&&a.closest&&a.closest('#ftab'))) renderFleet(); else $('#kpis').innerHTML=kpis();}
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
